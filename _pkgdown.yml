    license: "[Apache 2.0 licensed](https://github.com/ichirio/rtfreporter/blob/main/LICENSE.md)"

reference:
  # ── 0. Recipes ─────────────────────────────────────────────────────────
  - title: Start here — four complete recipes
    desc: >
      Copy-and-run examples for the four table shapes a clinical report is
      mostly made of: demographics, adverse events, PK concentrations and a
      laboratory shift table.  Each runs end to end, data in and RTF out, and
      they are shown together because **their arguments barely overlap** --
      what a demographics table needs, an adverse-events table does not.
    contents:
      - rtfreporter-recipes

  # ── 1. Document & rendering ────────────────────────────────────────────
  - title: Document & rendering
    desc: >
      Start here.  `rtf_document()` creates the document; the section and
      content calls below add to it; `generate_rtfreport()` writes the file.
      **Acts on:** the `rtf_document` object.
      `rtf_page()` and `rtf_default_format()` are the only settings that are
      document-only -- everything else in this reference acts on a table.
      `rtf_config()` edits an already-composed document; `rtf_document()`
      starts a new one.
    contents:
      - rtf_document
      - rtf_config
      - rtf_page
      - rtf_default_format
      - generate_rtfreport
      - print.rtf_document
      - print.rtfreport

  # ── 1b. Package defaults / configuration ───────────────────────────────
  - title: Package defaults
    desc: >
      Inspect and reset the `rtfreporter.*` option defaults (paper size,
      orientation, margins, font, font size).
      **Acts on:** nothing -- these set the fallbacks every other function
      uses when you do not pass a value.  A site can set its own in
      `Rprofile.site`; see the page-setup article.
    contents:
      - rtfreporter_options
      - rtfreporter_reset_defaults

  # ── 2. Sections: headers & footers ─────────────────────────────────────
  - title: Sections — headers & footers
    desc: >
      A section applies a running header / footer to a range of pages.
      **Acts on:** the `rtf_document` object.
      Headers and footers are themselves small tables: build their rows with
      `rtf_header()` / `rtf_footer()` and edit one row later with
      `update_header_row()` / `update_footer_row()`.
    contents:
      - rtf_section
      - rtf_header
      - rtf_footer
      - update_header_row
      - update_footer_row

  # ── 3. Page content: tables & figures ──────────────────────────────────
  - title: Page content — tables & figures
    desc: >
      Place a table or a figure on the page, with its titles and footnotes.
      **Acts on:** the `rtf_document` object -- `rtf_tables()` takes the
      `rtftable` objects the sections below produce.
      **Note the two levels:** `rtftable()` sets how a table looks; passing
      the same setting to `rtf_tables()` overrides it *for that placement
      only*, leaving the table object untouched.
    contents:
      - rtf_tables
      - rtf_figures
      - rtf_titles
      - rtf_footnotes
      - rtftable
      - rtfplot
      - print.rtftable
      - format.rtftable
      - summary.rtftable
      - print.rtfplot

  # ── 4. Importing external table objects ────────────────────────────────
  - title: Importing tables (gt / gtsummary / rtables / rlistings → rtftable)
    desc: >
      Turn a table object -- a `gt::gt()` table, a gtsummary table, an
      rtables/tern `VTableTree`, an rlistings `listing_df`, or a plain
      data.frame -- into `rtftable`
      objects, reading the source's metadata and paginating in one call.
      **Acts on:** the source object.  **Produces:** `rtftable` objects.
      `as_rtftables()` returns one per page (a list); `as_rtftable()` returns
      a single object.  `stub_cols()` prepares a tidy data.frame beforehand by
      merging hierarchy columns into one indented stub column; `stub_spec()`
      carries the same settings into `as_rtftables(stub = )`.
    contents:
      - as_rtftables
      - as_rtftable
      - combine_sections
      - stub_cols
      - stub_spec

  # ── 4b. Listings ───────────────────────────────────────────────
  - title: Listings (source data → listing body)
    desc: >
      Reshape source data into what a listing prints, before any of it is
      rendered: source variables joined into one printed column, a long cell
      wrapped over several physical rows, narrow gutter columns, and a blank
      row after each record.
      **Acts on:** a data.frame / tibble.  **Produces:** a data.frame, which
      `as_rtftables()` renders.
      `listing_col()` describes one printed column and `listing_spec()` the
      listing as a whole; `build_listing()` applies the spec, and
      `as_rtftables(listing = )` runs the same work inside the pipeline and
      derives the header, the widths and the alignment from it.  An rlistings
      `listing_df` needs none of this -- it is already laid out, and goes
      straight to `as_rtftables()`.
      `fit_listing_widths()` proposes every column's width from the page and
      the data, and `listing_code()` prints the spec as source to paste and
      tune.  `catx()` is the join a listing column makes, exported for the
      columns you build yourself.
    contents:
      - listing_col
      - listing_spec
      - build_listing
      - fit_listing_widths
      - listing_code
      - catx

  # ── 5. Column headers ──────────────────────────────────────────────────
  - title: Column headers
    desc: >
      Build and edit the column-header block.
      **Acts on:** an `rtftable` -- there is no header setting at document
      level.
      `col_cell()` describes one header cell and is accepted by
      `rtf_col_header()`, `rtftable(col_header = )`, `rtf_tables(col_header =
      )` and `set_header_cell()`.  A whole header built with
      `rtf_col_header()` goes to the same places plus `set_col_header()`.
      Coordinates are those of the **finished** table, so a merged stub counts
      as one column.
    contents:
      - col_cell
      - rtf_col_header
      - col_header_from_names
      - add_col_header_row
      - set_col_header
      - set_header_cell
      - rtf_columns
      - rtf_header_source

  # ── 5b. Post-hoc styling verbs ─────────────────────────────────────────
  - title: Post-hoc styling verbs
    desc: >
      Restyle a table you have already built, without rebuilding it.
      **Acts on:** an `rtftable`, or a list of them -- every verb here has a
      list method, so one call styles every page.
      These are the last word: they override whatever `rtftable()` or the
      source adapter set.  `set_decimal_split()` is the exception in kind --
      it does not change the data, only how a numeric column is rendered.
    contents:
      - style_header
      - collapse_repeats
      - set_decimal_split

  # ── 6. Built-in cell-format functions ──────────────────────────────────
  - title: Built-in cell-format functions
    desc: >
      Re-shape the TEXT of cells so counts and percentages line up.
      **Acts on:** a data.frame or a character vector, **before** it becomes a
      table.  Pass one to `rtftable(cell_format = )` /
      `as_rtftables(cell_format = )` to apply it during the build instead.
    contents:
      - format_count_pct
      - realign_count_pct
      - fmt_count_paren
      - fmt_count_paren_bare
      - fmt_right_align

  # ── 6b. Numeric display formatters ─────────────────────────────────────
  - title: Numeric display formatters
    desc: >
      Turn numbers into the strings a clinical table prints -- significant
      digits, rounding, alignment.
      **Acts on:** a data.frame or a numeric vector, **before** it becomes a
      table.  Numbers reaching `rtftable()` unformatted are converted with
      `as.character()`, which is rarely what a report wants, so format first.
    contents:
      - fmt_signif
      - fmt_round
      - fmt_numeric

  # ── 7. Blank rows ──────────────────────────────────────────────────────
  - title: Blank rows
    desc: Insert blank separator rows by position, by value change, or by rule.
    contents:
      - set_blank_rows
      - blank_rows_by_change
      - blank_rows_by_rule

  # ── 7b. Pagination strategies & helpers ────────────────────────────────
  - title: Pagination strategies & helpers
    desc: >
      Split a table across pages.
      **Acts on:** the body of a table being built.
      Vertical splitting is chosen with `as_rtftables(split = )` -- a strategy
      name (`"group_safe"`, `"group_force"`, `"by_value"`, `"rows"`, `"none"`)
      with its settings given as ordinary arguments alongside it, or a function
      of your own for a bespoke rule.
      `paginate_cols()` is the horizontal counterpart: it acts on a FINISHED
      `rtftable`, splitting a too-wide table by column and repeating the row
      headings on every page.
    contents:
      - paginate_cols
      - add_cont_label

  # ── 8. Borders ─────────────────────────────────────────────────────────
  - title: Borders
    desc: >
      Two constructors, and only two: `rtf_border_side()` describes one edge --
      its line style, width and colour -- and `rtf_border()` collects edges
      into the border of a cell, a row or a zone, including the rules *inside*
      a selection (`inside_h`, `inside_v`).
      **Where usable:** both are accepted by `rtftable(border = )`,
      `rtf_tables(border = )` and the `style_*()` verbs; `rtf_border()` is
      also accepted by `col_cell(border = )`.  There is **no border setting at
      document level**.  Later wins, per edge -- a `style_*()` call overrides
      `rtftable()`, which overrides the adapter.
      The constructors these two replaced are listed under *Deprecated* at the
      bottom of this page; `?rtf_border` pairs the old and the new spelling
      for every case.
    contents:
      - rtf_border_side
      - rtf_border

  # ── 9. Shared table styles ─────────────────────────────────────────────
  - title: Shared table styles (S3, snapshot)
    desc: >
      One object carrying borders, alignment, padding and row height, so a set
      of tables can share a look.
      **Where usable:** `rtftable(style = )` and `rtf_tables(style = )`.
      `rtf_table_style_with()` derives a variant from an existing style,
      changing only the fields you name.
    contents:
      - rtf_table_style
      - rtf_table_style_with
      - rtf_table_style_tfl

  # ── 10. Column-width utilities ─────────────────────────────────────────
  - title: Column-width utilities
    desc: >
      Measure text and size columns to their content.
      **Acts on:** a data.frame; returns widths in twips for
      `rtftable(column_widths_twips = )`.
      Use `auto_col_widths()` when long labels wrap; `as_rtftables(auto_width
      = TRUE)` does the same during the build, clamped to the writable page
      width.
    contents:
      - text_width_in
      - auto_col_widths

  # ── 11. Visual preview (S3 plot methods) ───────────────────────────────
  - title: Visual preview (S3 plot methods)
    desc: >
      Look at a table, a border or a document without writing a file.
      **Acts on:** whichever object you pass; nothing is modified.  These are
      for checking work in progress, not for producing output.
    contents:
      - plot.rtf_border
      - plot.rtf_border_side
      - plot.rtf_table_border
      - plot.rtftable
      - plot.rtf_document

  # ── 12. Assembling multiple RTF files ──────────────────────────────────
  - title: Assembling multiple RTF files
    desc: >
      Join finished RTF FILES into one, with a table of contents and
      continuous page numbering.
      **Acts on:** files on disk, not R objects -- this is the step after
      `generate_rtfreport()`.  A spec (`assemble_spec()`, a .csv/.xlsx) names
      the files and their TOC entries.
    contents:
      - assemble_rtf
      - assemble_files
      - assemble_folder
      - assemble_spec
      - assemble_from_spec
      - assemble_toc
      - toc_heading
      - toc_entry

  # ── 13. Post-processing ────────────────────────────────────────────────
  - title: Post-processing
    desc: >
      Edit a rendered RTF file in place -- substituting text a report needs
      only at delivery time, such as a run date or a draft watermark.
      **Acts on:** a file on disk.
    contents:
      - rtf_replace_text

  # ── 14. Superseded ─────────────────────────────────────────────────────
  - title: Superseded
    desc: >
      Still working and **not** scheduled for removal: newer work goes into
      the replacement each page names, but existing code need not change.
    contents:
      - paginate

  # ── 15. Deprecated ────────────────────────────────────────
  - title: Deprecated -- scheduled for removal
    desc: >
      The border constructors that `rtf_border_side()` and `rtf_border()`
      replaced at 0.5.0 / 0.6.0.  They still work and each warns once per
      session, naming its replacement, but they will be **removed in one
      batch before the CRAN submission** -- do not write new code against
      them.  `?rtf_border` pairs the old and the new spelling for every case.
      `rtf_border_none()`, `rtf_border_top()`, `rtf_border_bottom()` and
      `rtf_border_box()` are documented on the `rtf_border()` page itself.
    contents:
      - rtf_border_with
      - rtf_table_border
      - rtf_border_tfl

# Articles index page (/articles/).  Grouped so users land on the
# tutorial first; learner-focused material sits at the bottom.
articles:
  - title: For package users
    desc: >
      Practical guides for generating RTF deliverables.  Start with the
      Quickstart, then dive into the Pipe API guide.
    navbar: ~
    contents:
      - rtfreporter-quickstart
      - rtfreporter-pipes
      - articles/page-setup
      - articles/adding-content
      - articles/borders
      - gt-integration
      - articles/importing-tables
      - articles/listings
      - articles/pagination
      - articles/headers-footers
      - articles/section-splitting
      - articles/multistub-section-split
      - articles/output

  - title: Worked clinical examples
    desc: End-to-end recipes for typical clinical TFL deliverables.
    navbar: ~
    contents:
      - articles/showcase-dm
      - articles/showcase-ae
      - articles/tlg-catalog
      - articles/example-demog
      - articles/example-lab

  - title: For contributors
    desc: >
      How rtfreporter is built and how to extend it.  Start with the
      architecture overview, then the adapter how-to.  Each article opens
      in English with an "In Japanese" toggle at the top.
    navbar: ~
    contents:
      - articles/architecture
      - articles/extending-adapters
      - articles/external-api

  - title: コントリビューター向け資料（日本語 / Japanese）
    desc: >
      Japanese versions of the contributor articles, reachable from the
      "In Japanese" toggle at the top of each English page.
      日本語のコントリビューター向け資料です。
    navbar: ~
    contents:
      - articles/architecture-ja
      - articles/extending-adapters-ja
      - articles/external-api-ja

  # Deep-dive S3 / OOP references. Deliberately kept OUT of the navbar
  # Articles menu -- pkgdown requires every built article to appear in the
  # index, so they are listed here (advanced, URL-oriented) rather than being
  # unlisted, which pkgdown treats as an error.
  - title: "Internals & S3 (advanced)"
    desc: >
      Design internals and an R OOP / S3 primer. Not in the navbar menu.
      S3 内部設計と R のオブジェクト指向／S3 の解説。ナビゲーションメニューには出しません。
    navbar: ~
    contents:
      - articles/internal-design
      - articles/internal-design-ja

