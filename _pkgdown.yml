reference:
  # Ordered as the site recommends using the package: a table from an ARD
  # with a plan first; then the document, pages, headers, footers and tokens
  # around it; tables brought from other packages; listings; figures;
  # assembly; borders and styles; deprecated last.

  # ── 1. Tables from an ARD ──────────────────────────────────────────────
  - title: Tables from an ARD — reading the ARD
    desc: >
      The recommended start: an analysis results dataset (cards / cardx) made
      ready for a table.  **Acts on:** an ARD data frame.
      `normalize_ard()` flattens it -- groups and hierarchy become ordinary
      key columns -- and `widen_ard()` does the whole ARD half in one call,
      giving a table data frame now.  `list_ard_keys()`, `pull_ard()`,
      `overall_row()` and `cell_rows()` look inside an ARD and shape its rows.
      Start with the *Get started* article.
    contents:
      - ard-tables
      - normalize_ard
      - widen_ard
      - list_ard_keys
      - pull_ard
      - overall_row
      - cell_rows

  - title: Tables from an ARD — the plan
    desc: >
      `table_plan()` names the roles (what goes across, what goes down) and
      each `plan_*()` verb adds one declaration -- cells, labels, levels,
      stub, blank rows, pages, widths, header, titles.  Nothing runs until the
      plan is handed to `rtf_tables()` or `plan_apply()`, which give
      `rtftable` pages; a later layer wins over an earlier one.
      The header and the denominators in it agree with the columns by
      construction.  The Excel definition of a table lives in tflspec, which
      builds a plan from it (`tflspec::tfl_table_plan()`).
    contents:
      - table_plan
      - plan_verbs
      - plan_apply
      - plan_layers
      - plan_header_tokens
      - plan_n_candidates
      - plan_template

  # ── 2. The document ─────────────────────────────────────────────────
  - title: Document, rendering & tokens
    desc: >
      `rtf_document()` creates the document -- with the program, the
      `program_fallback` and tokens of your own (`tokens =`) for its
      headers and footers; the section and
      content calls below add to it; `generate_rtfreport()` writes the file.
      **Acts on:** the `rtf_document` object.
      `rtf_page()` and `rtf_default_format()` are the only settings that are
      document-only -- everything else in this reference acts on a table.
      `rtf_config()` edits an already-composed document; `rtf_document()`
      starts a new one.  `rtf_text_tokens()` lists every `{TOKEN}` a header,
      footer, title or footnote can carry (`{PAGE}`, `{PROGRAM}`,
      `{PROGRAM_FULL}`, `{DATETIME}`, your own).
    contents:
      - rtf_document
      - rtf_config
      - rtf_page
      - rtf_default_format
      - rtf_watermark
      - generate_rtfreport
      - rtf_text_tokens
      - print.rtf_document
      - print.rtfreport

  - title: Sections — headers & footers
    desc: >
      A section applies a running header / footer to a range of pages.
      **Acts on:** the `rtf_document` object.
      Headers and footers are themselves small tables: build their rows with
      `rtf_header()` / `rtf_footer()` (a list of rows -- to change one, make
      it again).
    contents:
      - rtf_section
      - rtf_header
      - rtf_footer

  - title: Page content — tables, titles & footnotes
    desc: >
      Place a table on the page, with its titles and footnotes.
      **Acts on:** the `rtf_document` object -- `rtf_tables()` takes the
      `rtftable` objects the sections below produce.
      **Note the two levels:** `rtftable()` sets how a table looks; passing
      the same setting to `rtf_tables()` overrides it *for that placement
      only*, leaving the table object untouched.
    contents:
      - rtf_tables
      - rtf_titles
      - rtf_footnotes
      - rtftable
      - print.rtftable
      - format.rtftable
      - summary.rtftable

  - title: Package defaults
    desc: >
      Inspect and reset the `rtfreporter.*` option defaults (paper size,
      orientation, margins, font, font size).
      **Acts on:** nothing -- these set the fallbacks every other function
      uses when you do not pass a value.  A site can set its own in
      `Rprofile.site`; see the page-setup article.
    contents:
      - rtfreporter_options
      - rtfreporter_reset_defaults

  # ── 3. Bring your own table; table building blocks ──────────────────
  - title: Bring your own table — as_rtftables()
    desc: >
      The second path: a table already built elsewhere -- a `gt::gt()`
      table, a gtsummary table, an rtables/tern `VTableTree`, a tfrmt,
      flextable or huxtable table, an rlistings `listing_df`, or a plain
      data.frame -- turned into `rtftable`
      objects, reading the source's metadata and paginating in one call.
      **Acts on:** the source object.  **Produces:** `rtftable` objects.
      `as_rtftables()` returns one per page (a list); `as_rtftable()` returns
      a single object.  `stub_cols()` prepares a tidy data.frame beforehand by
      merging hierarchy columns into one indented stub column; `stub_spec()`
      carries the same settings into `as_rtftables(stub = )`.
    contents:
      - as_rtftables
      - as_rtftable
      - combine_sections
      - stub_cols
      - stub_spec

  - title: Recipes — four complete tables from data frames
    desc: >
      Copy-and-run examples for the four table shapes a clinical report is
      mostly made of: demographics, adverse events, PK concentrations and a
      laboratory shift table.  Each runs end to end, data in and RTF out, and
      they are shown together because **their arguments barely overlap** --
      what a demographics table needs, an adverse-events table does not.
    contents:
      - rtfreporter-recipes

  - title: Column headers
    desc: >
      Build and edit the column-header block.
      **Acts on:** an `rtftable` -- there is no header setting at document
      level.
      `col_cell()` describes one header cell and is accepted by
      `rtf_col_header()`, `rtftable(col_header = )` and `rtf_tables(col_header =
      )`.  A whole header built with `rtf_col_header()` goes to the same
      places plus `set_col_header()`.
      Coordinates are those of the **finished** table, so a merged stub counts
      as one column.
      `col_key()` lets a cell name the columns it covers by a column-name
      segment instead of by position.
    contents:
      - col_cell
      - col_key
      - rtf_col_header
      - set_col_header
      - header_map
      - rtf_columns
      - rtf_header_source

  - title: Post-hoc styling verbs
    desc: >
      Restyle a table you have already built, without rebuilding it.
      **Acts on:** an `rtftable`, or a list of them -- every verb here has a
      list method, so one call styles every page.
      These are the last word: they override whatever `rtftable()` or the
      source adapter set.  `set_decimal_split()` is the exception in kind --
      it does not change the data, only how a numeric column is rendered.
    contents:
      - style_header
      - collapse_repeats
      - set_decimal_split

  - title: Built-in cell-format functions
    desc: >
      Re-shape the TEXT of cells so counts and percentages line up.
      **Acts on:** a data.frame or a character vector, **before** it becomes a
      table.  Pass one to `rtftable(cell_format = )` /
      `as_rtftables(cell_format = )` to apply it during the build instead.
    contents:
      - format_count_pct
      - realign_count_pct
      - fmt_count_paren
      - fmt_count_paren_bare
      - fmt_value_paren
      - fmt_right_align

  - title: Numeric display formatters & rounding
    desc: >
      Turn numbers into the strings a clinical table prints -- significant
      digits, rounding, alignment.
      **Acts on:** a data.frame or a numeric vector, **before** it becomes a
      table.  Numbers reaching `rtftable()` unformatted are converted with
      `as.character()`, which is rarely what a report wants, so format first.
      `round_num()` is the rounding rule every formatter (and a plan's
      templates) uses -- R's half-to-even, or SAS's half-away-from-zero with
      `options(rtfreporter.rounding = "sas")`.
    contents:
      - fmt_signif
      - fmt_round
      - fmt_numeric
      - round_num

  - title: Blank rows
    desc: Insert blank separator rows by position, by value change, or by rule.
    contents:
      - set_blank_rows
      - blank_rows_by_change
      - blank_rows_by_rule

  - title: Pagination strategies & helpers
    desc: >
      Split a table across pages.
      **Acts on:** the body of a table being built.
      Vertical splitting is chosen with `as_rtftables(split = )` -- a strategy
      name (`"group_safe"`, `"group_force"`, `"by_value"`, `"rows"`, `"none"`)
      with its settings given as ordinary arguments alongside it, or a function
      of your own for a bespoke rule.
      `paginate_cols()` is the horizontal counterpart: it acts on a FINISHED
      `rtftable`, splitting a too-wide table by column and repeating the row
      headings on every page.
    contents:
      - paginate_cols
      - add_cont_label

  - title: Column-width utilities
    desc: >
      Measure text and size columns to their content.
      **Acts on:** a data.frame; returns widths in twips for
      `rtftable(column_widths_twips = )`.
      Use `auto_col_widths()` when long labels wrap; `as_rtftables(auto_width
      = TRUE)` does the same during the build, clamped to the writable page
      width.
    contents:
      - text_width_in
      - auto_col_widths

  # ── 4. Listings ─────────────────────────────────────────────────────
  - title: Listings (source data → listing body)
    desc: >
      Reshape source data into what a listing prints, before any of it is
      rendered: source variables joined into one printed column, a long cell
      wrapped over several physical rows, narrow gutter columns, and a blank
      row after each record.
      **Acts on:** a data.frame / tibble.  **Produces:** a data.frame, which
      `as_rtftables()` renders.
      `listing_col()` describes one printed column and `listing_spec()` the
      listing as a whole; `build_listing()` applies the spec, and
      `as_rtftables(listing = )` runs the same work inside the pipeline and
      derives the header, the widths and the alignment from it.  An rlistings
      `listing_df` needs none of this -- it is already laid out, and goes
      straight to `as_rtftables()`.
      `fit_listing_widths()` proposes every column's width from the page and
      the data, and `listing_code()` prints the spec as source to paste and
      tune.  `listing_wrap()` is the rule that breaks a cell into lines, and
      `listing_wrap_code()` writes that rule out as source when a listing
      needs a different one -- calling `listing_disp_width()`,
      `listing_take()` and `listing_split_after()`, the measurements a rule
      is built on, rather than copying them.  `catx()` is the join a listing column makes,
      exported for the columns you build yourself.
    contents:
      - listing_col
      - listing_spec
      - build_listing
      - fit_listing_widths
      - listing_code
      - listing_wrap
      - listing_wrap_code
      - listing_measures
      - catx

  # ── 5. Figures ──────────────────────────────────────────────────────
  - title: Figures
    desc: >
      Place a plot or an image file on a page.  `rtfplot()` wraps a PNG / JPEG
      (or a plot object, saved for you); `rtf_figures()` adds figures to the
      document, with titles and footnotes, as `rtf_tables()` does for tables.
      **Acts on:** the `rtf_document` object.
    contents:
      - rtf_figures
      - rtfplot
      - print.rtfplot

  # ── 6. Assembly ─────────────────────────────────────────────────────
  - title: Assembling a deliverable & post-processing
    desc: >
      Join finished RTF FILES into one, with a table of contents and
      continuous page numbering.
      **Acts on:** files on disk, not R objects -- this is the step after
      `generate_rtfreport()`.  The table of contents is a table (file, label,
      heading, level) -- `assemble_folder()` makes it from a folder -- or the
      path of one (.xlsx / .csv).  `rtf_replace_text()` edits a rendered
      file in place -- text a report needs only at delivery time.
    contents:
      - assemble_rtf
      - assemble_folder
      - rtf_replace_text

  # ── 7. Borders, styles, preview ─────────────────────────────────────
  - title: Borders
    desc: >
      Two constructors, and only two: `rtf_border_line()` describes one edge --
      its line style, width and colour -- and `rtf_border()` collects edges
      into the border of a cell, a row or a zone, including the rules *inside*
      a selection (`inside_h`, `inside_v`).
      **Where usable:** both are accepted by `rtftable(border = )`,
      `rtf_tables(border = )` and the `style_*()` verbs; `rtf_border()` is
      also accepted by `col_cell(border = )`.  There is **no border setting at
      document level**.  Later wins, per edge -- a `style_*()` call overrides
      `rtftable()`, which overrides the adapter.
      The constructors these two replaced are listed under *Deprecated* at the
      bottom of this page; `?rtf_border` pairs the old and the new spelling
      for every case.
    contents:
      - rtf_border_line
      - rtf_border

  - title: Shared table styles (S3, snapshot)
    desc: >
      One object carrying borders, alignment, padding and row height, so a set
      of tables can share a look.
      **Where usable:** `rtftable(style = )` and `rtf_tables(style = )`.
      `rtf_table_style_with()` derives a variant from an existing style,
      changing only the fields you name.
    contents:
      - rtf_table_style
      - rtf_table_style_with
      - rtf_table_style_tfl

  - title: Visual preview (S3 plot methods)
    desc: >
      Look at a table, a border or a document without writing a file.
      **Acts on:** whichever object you pass; nothing is modified.  These are
      for checking work in progress, not for producing output.
    contents:
      - plot.rtf_border
      - plot.rtf_border_line
      - plot.rtf_table_border
      - plot.rtftable
      - plot.rtf_document

  # ── 8. AI assistant ─────────────────────────────────────────────────
  - title: Working with an AI assistant
    desc: >
      The package is too new to be in a chat model's training data, so an
      assistant has to be told the API before it writes any.  Two briefings
      ship inside the package for that -- one for *using* rtfreporter, one for
      working *on* it -- and this returns the copy installed alongside your
      version, which is the one that matches what you actually have.
    contents:
      - rtfreporter_ai_manual

  # ── 9. Deprecated ───────────────────────────────────────────────────
  - title: Deprecated -- scheduled for removal
    desc: >
      The border constructors that `rtf_border_line()` and `rtf_border()`
      replaced at 0.5.0 / 0.6.0.  They still work and each warns once per
      session, naming its replacement, but they will be **removed in one
      batch before the CRAN submission** -- do not write new code against
      them.  `?rtf_border` pairs the old and the new spelling for every case.
      `rtf_border_none()`, `rtf_border_top()`, `rtf_border_bottom()` and
      `rtf_border_box()` are documented on the `rtf_border()` page itself.
      Since 0.8.2.9013 (the pre-CRAN API review) also: `rtf_border_side()`
      (now `rtf_border_line()`, documented on its page), the header editors
      below (write the header in `rtf_col_header()` / `rtf_header()`
      instead), `paginate()` (use `as_rtftables()`), and the arguments
      `rtftable(spanning_header = )` and `as_rtftable(gt_obj = )` (now `x`),
      the `as_rtftables()` arguments `stub_vars` / `stub_label` /
      `stub_indent` / `stub_group_summary` (now `stub = `), and the assembly
      helpers below (`assemble_folder()` and `assemble_rtf(toc = <a table>)`).
    contents:
      - rtf_border_with
      - rtf_table_border
      - rtf_border_tfl
      - add_col_header_row
      - col_header_from_names
      - set_header_cell
      - update_header_row
      - paginate
      - assemble_files
      - assemble_spec
      - assemble_toc
      - assemble_from_spec
      - toc_heading
      - toc_entry

# Articles index page (/articles/).  Same order as the navbar menu: the ARD +
# plan workflow first, a table from another package second, then listings,
# figures and the document around them; contributor material at the bottom.
articles:
  - title: Gallery
    desc: >
      Clinical tables, a listing and figures made with rtfreporter from the
      CDISC pilot data, each with the code that wrote it.
    navbar: ~
    contents:
      - articles/gallery

  - title: Tables from an ARD (recommended)
    desc: >
      From a cards / cardx analysis results dataset to RTF pages with a plan:
      normalize_ard(), table_plan() and the plan_*() verbs, rtf_tables() and
      generate_rtfreport().  Start with Get started.
    navbar: ~
    contents:
      - rtfreporter
      - articles/tables-from-ard
      - articles/plan-verbs
      - articles/plan-and-as-rtftables

  - title: Bring your own table
    desc: >
      A table already built with gt, gtsummary, rtables / tern, tfrmt,
      flextable, huxtable or as a data frame, read by as_rtftables() --
      labels, spanning headers and footnotes included -- and paginated.
    navbar: ~
    contents:
      - articles/importing-tables
      - gt-integration
      - rtfreporter-quickstart
      - articles/pagination
      - articles/multistub-section-split
      - articles/showcase-dm
      - articles/showcase-ae
      - articles/tlg-catalog

  - title: Listings
    desc: Subject listings, written as a plan or from a listing spec.
    navbar: ~
    contents:
      - articles/plan-listings
      - articles/listings

  - title: Figures
    desc: A plot object, or an image file, placed on a page.
    navbar: ~
    contents:
      - articles/figures

  - title: Assembling a deliverable
    desc: >
      The document around the tables, listings and figures -- page setup,
      running headers and footers with their tokens, sections, titles and
      footnotes, borders -- and joining finished files into one deliverable.
    navbar: ~
    contents:
      - articles/page-setup
      - articles/headers-footers
      - articles/section-splitting
      - articles/adding-content
      - articles/borders
      - articles/output

  - title: For contributors
    desc: >
      How rtfreporter is built and how to extend it.  Most work now happens
      with a chat assistant in the loop, so that article comes first; the
      architecture overview and the adapter how-to behind it are the
      authority either way, and the route to follow when working by hand.
      Each article opens in English with an "In Japanese" toggle at the top.
    navbar: ~
    contents:
      - articles/ai-development
      - articles/architecture
      - articles/extending-adapters
      - articles/external-api

  - title: コントリビューター向け資料（日本語 / Japanese）
    desc: >
      Japanese versions of the contributor articles, reachable from the
      "In Japanese" toggle at the top of each English page.
      日本語のコントリビューター向け資料です。
    navbar: ~
    contents:
      - articles/ai-development-ja
      - articles/architecture-ja
      - articles/extending-adapters-ja
      - articles/external-api-ja

  # Deep-dive S3 / OOP references. Deliberately kept OUT of the navbar
  # Articles menu -- pkgdown requires every built article to appear in the
  # index, so they are listed here (advanced, URL-oriented) rather than being
  # unlisted, which pkgdown treats as an error.
  - title: "Internals & S3 (advanced)"
    desc: >
      Design internals and an R OOP / S3 primer. Not in the navbar menu.
      S3 内部設計と R のオブジェクト指向／S3 の解説。ナビゲーションメニューには出しません。
    navbar: ~
    contents:
      - articles/internal-design
      - articles/internal-design-ja

# News configuration:
# Until v0.1.0 we are publishing every dev release as one rolling section
# ("Development version").  Once v0.1.0 ships the section breakdown
# below will be updated to show per-version history.
news:
  one_page: true
  releases:
    - text: "Development version (pre-v0.1.0)"
