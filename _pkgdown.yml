template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: "#1f4e79"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}
  opengraph:
    twitter:
      creator: "@ichirio"
      site: "@ichirio"
      card: summary

# Development-version banner: every push overwrites the published docs at the
# root (no version subdir), so the site always shows `main`.  That is why the
# AI manuals are version-stamped and shipped in the package instead (#463) --
# the site cannot tell a reader which release it is describing, and they can.
# Whether to move to `mode: auto` (released docs at the root, development docs
# under /dev/) is a decision for the CRAN submission, since it moves every URL.
#
# `mode: unreleased` is deliberate (NOT "release"):
#   * pages are still published at the root (no /dev/ subdirectory),
#   * but pkgdown does NOT suppress the README's <!-- badges ... -->
#     block when lifting it into the sidebar `dev` slot.  Under
#     `mode: release` the badges would be hidden, which is wrong for
#     a pre-release codebase whose status we WANT users to see.
development:
  mode: unreleased
  version_label: warning
  # Deliberately version-agnostic: naming a specific version here goes stale
  # every release.  The current release is stated in the `devnotes` sidebar.
  version_tooltip: >
    Pre-1.0 development version.  The API may still change in
    backwards-incompatible ways before v1.0.0.

home:
  title: "rtfreporter — Clinical RTF Reporting Toolkit for R"
  description: >
    Standalone R toolkit for generating Rich Text Format (RTF) Tables,
    Listings and Figures (TFLs) for clinical trial deliverables.  Pure
    S3 architecture; no dependency on r2rtf, reporter, or any other RTF
    library; works on any modern R out of the box.
  # Keep README's H1 (which contains the logo image) on the home page.
  strip_header: false
  sidebar:
    # User-facing info (Links / Community / Citation / Developers /
    # License) on top; dev-status (badges) and the dev-stage roadmap
    # are deliberately pushed to the BOTTOM of the sidebar so they
    # don't compete for attention on the landing page.  `dev` is the
    # built-in slot pkgdown uses to inject the README's
    # `<!-- badges: start --> ... <!-- badges: end -->` block — DO NOT
    # override it with a custom `dev:` component or the badges will
    # vanish.  Roadmap / dev-stage notes live in `devnotes`.
    structure: [links, community, citation, authors, license, devnotes, dev]
    components:
      devnotes:
        title: Dev stage
        text: |
          v0.8.2 released (current stable); pre-1.0, the API may still change
          before v1.0.0.  Development continues at `0.8.2.9000` — the standard
          R scheme, where the three-component part names the last release.

          Roadmap:

          - **v0.9.0** — the **first CRAN submission**: the deprecated border
            exports removed, `R CMD check --as-cran` clean, lifted coverage,
            docs/metadata polish.  Removing them is a MINOR only because
            `MAJOR 0` means "not formally released" — see CONTRIBUTING.
          - **v1.0.0** — **after** CRAN registration, once downloads and
            feedback have settled the API: stable, `lifecycle: experimental`
            removed, and the no-breaking-change contract binding for real.
      community:
        title: Community
        text: |
          [Open an issue](https://github.com/ichirio/rtfreporter/issues/new)
          ·
          [Browse issues](https://github.com/ichirio/rtfreporter/issues)
          ·
          [Discussions](https://github.com/ichirio/rtfreporter/discussions)
          ·
          [Contributing](https://github.com/ichirio/rtfreporter/blob/main/CONTRIBUTING.md)
  # The sidebar's "Links" section is auto-generated from DESCRIPTION's URL /
  # BugReports ("Browse source code" / "Report a bug"); the License section
  # is auto-generated too -- so we don't repeat them here.  Curated community
  # links live in the `community` component above.

