# Standard R-CMD-check workflow, derived from r-lib/actions examples.
# Matrix covers the platforms and R versions CRAN expects.
#
# At a published release, and by hand, each job also writes its environment
# (sessionInfo, the dependencies' versions, R CMD check's result, the tests'
# log) and the last job gathers them into the Quality Report
# (validation/report.R): one table of every environment, the traceability
# matrix and the deviations.  A release keeps them as its assets (an
# artifact is deleted after 90 days).
on:
  push:
    branches: [main, master, next]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

# On next, a newer push cancels the run still going (nobody waits for it);
# main and pull requests keep every run (each run is its own group).
concurrency:
  group: ${{ github.ref == 'refs/heads/next' && format('{0}-next', github.workflow) || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel',     http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # the oldest R tested: a suggested package that cannot be installed
          # on it (it, or what it needs, wants a newer R) is left out
          # (`pkgs`), and the check lets a suggested package be missing
          - {os: ubuntu-latest,  r: '4.2', pkgs: 'tern=?ignore-before-r=4.4.0', force-suggests: 'false'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck ${{ matrix.config.pkgs }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        id: check
        env:
          _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.force-suggests || 'true' }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # a release or a run by hand: this environment, for the summary
      - name: This environment, for the validation report
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          Rscript validation/env.R "${{ matrix.config.os }} (R ${{ matrix.config.r }})" ci             "${{ steps.check.outcome }}" check

      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        with:
          name: env-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: validation/env-out/

  # The Quality Report: every environment, the traceability
  # matrix, the deviations; one PDF and its attachments.  At a release they
  # are attached to it; by hand they are this run's artifact.
  quality-report:
    needs: R-CMD-check
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: env-*
          path: validation/env-out
          merge-multiple: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::rmarkdown, any::knitr, any::pkgload, any::testthat, any::writexl
          needs: check

      - name: The report
        run: Rscript validation/report.R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: |
            validation/out/quality-report.pdf
            validation/out/quality-report.md
            validation/out/traceability.xlsx
            validation/out/*.csv
            validation/out/*.txt

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          cd validation/out
          cp quality-report.pdf "quality-report-$tag.pdf"
          cp traceability.xlsx "traceability-$tag.xlsx"
          cp environments.txt "environments-$tag.txt"
          gh release upload "$tag" "quality-report-$tag.pdf" "traceability-$tag.xlsx"             "environments-$tag.txt" --clobber
