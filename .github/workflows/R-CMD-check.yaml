# Standard R-CMD-check workflow, derived from r-lib/actions examples.
# Matrix covers the platforms and R versions CRAN expects.
#
# At a published release, and by hand, each job also writes its environment
# (sessionInfo, the dependencies' versions, R CMD check's result, the tests'
# log) and the last job gathers them, with the maintainers' local runs
# (validation/env-local/), into the Quality Report (validation/report.R): one
# table of every environment, the results, the Traceability Matrix and the
# deviations.  Only the published release's run concludes "validation-ready"
# (a run by hand is marked DRAFT).  A release keeps them as its assets (an
# artifact is deleted after 90 days).
on:
  push:
    branches: [main, master, next]
  # (a pull request into next runs quick-check.yaml instead)
  pull_request:
    branches-ignore: [next]
  release:
    types: [published]
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

# On next, a newer push cancels the run still going (nobody waits for it);
# main and pull requests keep every run (each run is its own group).
concurrency:
  group: ${{ github.ref == 'refs/heads/next' && format('{0}-next', github.workflow) || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel',     http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        id: check
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # a release or a run by hand: this environment, for the Quality Report
      - name: This environment, for the Quality Report
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          Rscript validation/env.R "${{ matrix.config.os }} (R ${{ matrix.config.r }})" ci             "${{ steps.check.outcome }}" check

      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        with:
          name: env-${{ matrix.config.os }}-${{ matrix.config.r }}
          path: validation/env-out/

  # The minimum environment: R at DESCRIPTION's `Depends` and every direct
  # dependency at the minimum DESCRIPTION names (`pkg@<minimum>`); the
  # suggested packages with no minimum, and every indirect dependency, come
  # from CRAN as it was on PPM_DATE (a dated Posit Package Manager snapshot,
  # the first with the newest minimum, tfrmt 0.3.0).  The recommended
  # environment -- the latest R with the latest packages -- is the matrix's
  # release jobs.  Why each minimum: inst/validation/dependency-minimums.md.
  minimum-environment:
    runs-on: ubuntu-24.04

    name: ubuntu-24.04 (R 4.2, minimum environment)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_MIN: '4.2'
      PPM_DATE: '2026-01-25'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_MIN }}
          use-public-rspm: false

      # CRAN as it was on PPM_DATE, as binaries for this Ubuntu (noble); pak
      # reads the repos option, and the user agent makes PPM serve binaries
      - name: CRAN as on PPM_DATE
        shell: bash
        run: |
          cat >> "$(R RHOME)/etc/Rprofile.site" <<EOF
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/${PPM_DATE}"),
                  HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
                                          paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])))
          EOF
          Rscript -e 'print(getOption("repos"))'

      # pak refs from DESCRIPTION: `pkg@<minimum>` where it names a minimum,
      # `any::pkg` where it does not; and R must be DESCRIPTION's minimum
      - name: The minimum versions, from DESCRIPTION
        id: pins
        shell: Rscript {0}
        run: |
          d <- read.dcf("DESCRIPTION", fields = c("Depends", "Suggests"))[1, ]
          r_min <- sub("^.*R [(]>= *([0-9.]+)[)].*$", "\\1", d[["Depends"]])
          if (!identical(r_min, Sys.getenv("R_MIN")) ||
              !identical(paste(R.version$major, sub("[.].*$", "", R.version$minor), sep = "."), r_min)) {
            stop("R_MIN (", Sys.getenv("R_MIN"), ") and this R (", getRversion(),
                 ") must be DESCRIPTION's Depends: R (>= ", r_min, ")")
          }
          s <- trimws(strsplit(d[["Suggests"]], ",")[[1L]])
          s <- s[nzchar(s)]
          pkg <- sub("\\s*[(].*$", "", s)
          min <- ifelse(grepl("[(]>=", s), sub("^.*[(]>=\\s*([^)]+)[)].*$", "\\1", s), NA)
          refs <- ifelse(is.na(min), paste0("any::", pkg), paste0(pkg, "@", min))
          cat(paste(refs, collapse = "\n"), "\n")
          cat(sprintf("refs=%s\n", paste(refs, collapse = " ")),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck ${{ steps.pins.outputs.refs }}
          needs: check

      - name: The repository and the versions installed
        shell: Rscript {0}
        run: |
          print(getOption("repos"))
          # what pak resolved from: the lockfile setup-r-dependencies wrote
          lock <- tryCatch(readLines(".github/pkg.lock", warn = FALSE), error = function(e) character())
          urls <- regmatches(lock, regexpr("https?://[^\"]+", lock))
          cat("Where the lockfile's packages come from:\n")
          print(table(sub("^(https?://[^/]+/[^/]+/[^/]+/[^/]+/[^/]+).*$", "\\1", urls)))
          s <- read.dcf("DESCRIPTION", fields = "Suggests")[1, 1]
          s <- trimws(strsplit(s, ",")[[1L]])
          s <- s[nzchar(s)]
          pkg <- sub("\\s*[(].*$", "", s)
          ver <- vapply(pkg, function(p) tryCatch(as.character(utils::packageVersion(p)),
                                                 error = function(e) "not installed"), "")
          print(data.frame(suggests = s, installed = ver), row.names = FALSE)

      - uses: r-lib/actions/check-r-package@v2
        id: check
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # a release or a run by hand: this environment, for the Quality Report
      - name: This environment, for the Quality Report
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          Rscript validation/env.R "ubuntu-24.04 (R ${R_MIN}, minimum environment)" ci "${{ steps.check.outcome }}" check

      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
        with:
          name: env-minimum-environment
          path: validation/env-out/

  # The Quality Report: every environment, the Traceability Matrix, the
  # deviations; one PDF and its attachments.  At a release they are attached
  # to it; by hand they are this run's artifact (and the report a DRAFT).
  quality-report:
    needs: [R-CMD-check, minimum-environment]
    if: always() && (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: env-*
          path: validation/env-out
          merge-multiple: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::rmarkdown, any::knitr, any::pkgload, any::testthat, any::writexl
          needs: check

      - name: The report
        run: Rscript validation/report.R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: |
            validation/out/quality-report.pdf
            validation/out/quality-report.md
            validation/out/traceability_matrix.xlsx
            validation/out/*.csv
            validation/out/*.txt

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          cd validation/out
          # the report and every attachment its reading guide names
          files=""
          for f in quality-report.pdf traceability_matrix.xlsx environments.txt test-log.txt \
                   ft.csv functions.csv candidates.csv; do
            cp "$f" "${f%.*}-$tag.${f##*.}"
            files="$files ${f%.*}-$tag.${f##*.}"
          done
          gh release upload "$tag" $files --clobber
