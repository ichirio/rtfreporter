# Build a pkgdown site and deploy it to GitHub Pages.
# Derived from r-lib/actions examples.
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # tags + history: the AI-manual step reads released copies out of
          # the tags (see "Publish the AI manuals").
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      # vignettes/articles/*.qmd → needs the Quarto CLI + R package.
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # quarto = R bindings to the Quarto CLI installed above.
          # kableExtra = used by the worked-example articles
          #              (vignettes/articles/example-*.qmd).
          extra-packages: any::pkgdown, any::quarto, any::kableExtra, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # The AI manuals live in inst/ai/ so they install WITH the package and
      # cannot disagree with packageVersion() (#463).  pkgdown does not know
      # about inst/, so publish them here.
      #
      # What the folder holds: every RELEASE that shipped the manuals, plus
      # the CURRENT development build -- nothing else.  Superseded development
      # copies are not kept; only the newest one is of any use, and a stale
      # one is a trap for anyone who finds it.
      #
      # The unversioned alias is the newest RELEASE, not this build: someone
      # following a bare link has installed a release, and a bookmark should
      # not start describing unreleased API behind their back.  The current
      # development copy is reachable at its own stamped name.
      #
      # gh-pages is rewritten on every deploy (force_orphan), so nothing
      # accumulates on the branch by itself.  Everything published here is
      # therefore regenerated from a source of truth on each build -- the tags
      # for the releases, the working tree for the development copy -- and the
      # result is identical whichever commit builds it.
      - name: Publish the AI manuals
        run: |
          set -euo pipefail
          version=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          names="rtfreporter-ai-user-manual rtfreporter-ai-dev-manual"
          mkdir -p docs/ai

          # the current development build, at its own stamped name
          for name in $names; do
            cp "inst/ai/${name}.md" "docs/ai/${name}-${version}.md"
          done

          # every release that shipped the manuals, read out of its tag
          latest=""
          for tag in $(git tag -l 'v*' --sort=v:refname); do
            for name in $names; do
              if git cat-file -e "${tag}:inst/ai/${name}.md" 2>/dev/null; then
                git show "${tag}:inst/ai/${name}.md" > "docs/ai/${name}-${tag#v}.md"
                latest="$tag"
              fi
            done
          done

          # the alias tracks the newest release
          if [ -n "$latest" ]; then
            for name in $names; do
              git show "${latest}:inst/ai/${name}.md" > "docs/ai/${name}.md"
            done
            echo "alias -> ${latest}"
          else
            echo "no release ships the manuals yet; alias points at this build"
            for name in $names; do cp "inst/ai/${name}.md" "docs/ai/${name}.md"; done
          fi

          ls -l docs/ai
        shell: bash

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          # Re-write gh-pages as a single-commit branch each deploy so we
          # never see merge / fast-forward errors from accumulated history.
          # Pre-v0.1.0 there is no version-history retention requirement.
          force_orphan: true
          user_name:  "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy pkgdown site (${{ github.sha }})"
