# The release's validation report: the Development Summary Report (FR -> FT)
# and its evidence (R CMD check, the tests' results, covr, the tests that run
# each exported function, the environment), one PDF.
#
# Runs only for a published GitHub Release (the PDF is attached to it, as
# cards does) and by hand (the PDF kept as the run's artifact).  Never on a
# push, a pull request, next, main or a test tag (ai-test-*).  covr,
# covtracer, rcmdcheck and rmarkdown are installed here; they are not the
# package's dependencies.
on:
  release:
    types: [published]
  workflow_dispatch:

name: validation-report

permissions:
  contents: write

jobs:
  validation-report:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: >-
            any::rcmdcheck, any::covr, any::covtracer, any::rmarkdown,
            any::knitr, any::pkgload, any::testthat
          needs: check

      - name: The report
        run: Rscript validation/report.R

      - name: Keep it as the run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            validation/out/validation-report.pdf
            validation/out/traceability.xlsx
            validation/out/*.csv
            validation/out/*.txt
            validation/out/summary.md
          if-no-files-found: warn

      # A release: the PDF attached to it (a run by hand is not)
      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp validation/out/validation-report.pdf \
             "validation-report-${{ github.event.release.tag_name }}.pdf"
          gh release upload "${{ github.event.release.tag_name }}" \
             "validation-report-${{ github.event.release.tag_name }}.pdf" --clobber
