# A pull request into next: one quick job -- the package installed and its
# tests run, on ubuntu with R release; no --as-cran, no other platforms,
# no pkgdown -- so that next does not queue behind the full matrix.
# The full R-CMD-check (6 environments) runs on the pull request that takes
# next into main.
# The tests run only once the pull request is ready to merge: when it gets
# the automerge label, and on each push after that (the user, 2026-11-22: the
# regression tests once before the merge; a push before it tests only the
# changed area, locally).  Without the label the job is skipped.
on:
  pull_request:
    branches: [next]
    types: [opened, synchronize, reopened, labeled]

name: quick-check

permissions:
  contents: read

jobs:
  tests:
    # the automerge label just added, or a push to a pull request that has it
    # (another label added does not run it again)
    if: >-
      (github.event.action == 'labeled' && github.event.label.name == 'automerge') ||
      (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'automerge'))
    # a newer run of the same pull request cancels the one still going (here,
    # not on the workflow: a skipped run must not cancel a running one)
    concurrency:
      group: quick-check-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    name: tests (ubuntu-latest, R release)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Install the package
        run: R CMD INSTALL --no-docs --no-multiarch .

      - name: Tests
        shell: Rscript {0}
        run: |
          pkg <- read.dcf("DESCRIPTION", fields = "Package")[1L, 1L]
          library(pkg, character.only = TRUE)
          testthat::test_dir("tests/testthat", package = pkg, load_package = "installed",
                             reporter = testthat::ProgressReporter$new(show_praise = FALSE),
                             stop_on_failure = TRUE)
